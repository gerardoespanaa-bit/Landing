
<script>
/* Confirma este número antes de publicar; se conserva el del sitio anterior. */
const PHONE = "524423776762";

const MSG = {
  general: "Hola, Gerardo. Quiero agendar una asesoría y conocer cómo puedes ayudarme.",
  simulador: "Hola, Gerardo. Acabo de calcular una proyección de retiro y quiero revisarla contigo.",
  retiro: "Hola, Gerardo. Quiero revisar opciones de plan personal de retiro.",
  seguros: "Hola, Gerardo. Quiero revisar opciones de prevención de riesgos y seguros.",
  bolsa: "Hola, Gerardo. Quiero hablar sobre asesoría para invertir en bolsa.",
  auto: "Hola, Gerardo. Quiero conocer opciones de seguro para mi auto."
};

const backdrop = document.getElementById("backdrop");

function contact(key) {
  key = MSG[key] ? key : "general";
  document.getElementById("modalText").textContent =
    MSG[key] + " Al continuar, WhatsApp se abrirá con este mensaje preparado.";
  document.getElementById("waLink").href =
    "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(MSG[key]);
  backdrop.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  backdrop.classList.remove("open");
  document.body.style.overflow = "";
}

document.querySelectorAll("[data-wa]").forEach(el => {
  el.addEventListener("click", event => {
    event.preventDefault();
    contact(el.dataset.wa);
  });
});

document.querySelectorAll(".service-card").forEach(el => {
  el.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      contact(el.dataset.wa);
    }
  });
});

document.getElementById("close").onclick = closeModal;
document.getElementById("cancel").onclick = closeModal;
backdrop.addEventListener("click", event => {
  if (event.target === backdrop) closeModal();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

const menu = document.getElementById("menu");
const links = document.getElementById("links");

menu.onclick = () => {
  const isOpen = links.classList.toggle("open");
  menu.setAttribute("aria-expanded", String(isOpen));
};

links.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => links.classList.remove("open"));
});

const form = document.getElementById("calc");
const age = document.getElementById("age");
const monthly = document.getElementById("monthly");
const retire = document.getElementById("retire");
const amount = document.getElementById("amount");
const caption = document.getElementById("caption");
const canvas = document.getElementById("chart");

function fmt(value) {
  return new Intl.NumberFormat("es-MX", {
    style: "currency",
    currency: "MXN",
    maximumFractionDigits: 0
  }).format(value);
}

/* Aportaciones al final de cada mes; rendimiento efectivo anual supuesto del 10%. */
function project(currentAge, monthlyAmount, retirementAge) {
  const months = (retirementAge - currentAge) * 12;
  const monthlyRate = Math.pow(1.10, 1 / 12) - 1;
  let balance = 0;
  const points = [0];

  for (let month = 1; month <= months; month++) {
    balance = balance * (1 + monthlyRate) + monthlyAmount;
    if (month % 12 === 0) points.push(balance);
  }

  return {
    balance,
    points,
    years: retirementAge - currentAge,
    contributions: monthlyAmount * months
  };
}

function draw(points) {
  const ctx = canvas.getContext("2d");
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.max(1, width * dpr);
  canvas.height = Math.max(1, height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const max = Math.max(...points, 1);
  const coords = points.map((value, index) => ({
    x: 5 + (width - 10) * index / Math.max(1, points.length - 1),
    y: height - 5 - (height - 10) * value / max
  }));

  ctx.strokeStyle = "#b8d8f4";
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.beginPath();

  coords.forEach((point, index) => {
    if (index === 0) ctx.moveTo(point.x, point.y);
    else ctx.lineTo(point.x, point.y);
  });

  ctx.stroke();

  const last = coords[coords.length - 1];
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
  ctx.fill();
}

function updateCalculator() {
  const currentAge = Number(age.value);
  const monthlyAmount = Number(monthly.value);
  const retirementAge = Number(retire.value);

  if (
    !Number.isFinite(currentAge) ||
    !Number.isFinite(monthlyAmount) ||
    !Number.isFinite(retirementAge) ||
    currentAge < 18 || currentAge > 64 ||
    monthlyAmount < 2000 || monthlyAmount > 1000000 ||
    retirementAge < 65 || retirementAge > 90 ||
    retirementAge <= currentAge
  ) {
    amount.textContent = "Revisa tus datos";
    caption.textContent =
      "Edad: 18–64; aportación: $2,000–$1,000,000 al mes; retiro: 65–90 años.";
    draw([0, 1]);
    return;
  }

  const result = project(currentAge, monthlyAmount, retirementAge);
  amount.textContent = fmt(result.balance);
  caption.textContent =
    `En ${result.years} años habrías aportado ${fmt(result.contributions)}. ` +
    "Supuesto: 10% anual, sin inflación, comisiones ni impuestos.";

  draw(result.points);
}

form.addEventListener("submit", event => {
  event.preventDefault();
  updateCalculator();
});

[age, monthly, retire].forEach(input => {
  input.addEventListener("input", updateCalculator);
});

window.addEventListener("resize", updateCalculator);
updateCalculator();
</script>
</body>
</html>
